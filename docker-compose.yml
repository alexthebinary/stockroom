# Runs the whole demo — app plus Postgres — with one command:
#   docker compose up -d
#
# Mirrors the hosted shape (Postgres, container entrypoint, Basic auth) so what
# you test locally is what a PaaS would run. Set BASIC_AUTH_PASSWORD in a .env
# file beside this one, or export it before bringing the stack up.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: stockroom
    volumes:
      - stockroom-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/stockroom
      HOST: 0.0.0.0
      PORT: 4000
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-demo}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD before starting}
    ports:
      - "127.0.0.1:4100:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  stockroom-db:
