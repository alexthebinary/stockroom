# Runs anywhere Docker runs: `docker compose up -d` gives you the app on :4100
# and Postgres on :5432. For development, `docker compose up -d db` is enough.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: profitindex
      POSTGRES_PASSWORD: profitindex
      POSTGRES_DB: profitindex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitindex"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://profitindex:profitindex@db:5432/profitindex
      PORT: "4100"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4100:4100"
volumes:
  pgdata:
