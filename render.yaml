# Render blueprint — the runner-up path. Deploy with: New > Blueprint.
#
# One web service serving both the API and the built UI, plus managed Postgres.
# SQLite is not used here: Render's filesystem is ephemeral, so a SQLite file
# would be wiped on every deploy and restart.
#
# Migration and conditional seeding are handled by the container entrypoint,
# which seeds ONLY an empty database.
services:
  - type: web
    name: stockroom
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        # Render routes into the container, so bind all interfaces.
        value: 0.0.0.0
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: stockroom-db
          property: connectionString
      - key: BASIC_AUTH_USER
        value: demo
      - key: BASIC_AUTH_PASSWORD
        # Render generates this and shows it in the dashboard.
        generateValue: true

databases:
  - name: stockroom-db
    plan: free
